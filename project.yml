name: ARIA
options:
  bundleIdPrefix: com.rockstars4nny
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ARIA:
    type: application
    platform: iOS
    sources:
      - path: ARIA
    settings:
      base:
        PRODUCT_NAME: ARIA
        PRODUCT_BUNDLE_IDENTIFIER: com.rockstars4nny.aria
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
