# Codemagic CI — builds an UNSIGNED .ipa on a macOS runner (free tier works).
# Fastest path for a Windows user: sign up at codemagic.io, connect this GitLab repo,
# pick the "finch-unsigned-ipa" workflow, Start new build. Download the .ipa artifact,
# then sign it on Windows with 3uTools (Toolbox → IPA Signature → your Apple ID).
workflows:
  finch-unsigned-ipa:
    name: Finch Mobile — unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: bash BUILD_UNSIGNED_IPA.sh
      - name: Stage versioned copies for 3uTools
        script: |
          cp FinchMobile.ipa FinchMobile-3.2.ipa
    artifacts:
      - FinchMobile.ipa
      - FinchMobile-*.ipa
      - build.log
