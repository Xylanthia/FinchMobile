name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "FinchMobile/**"
      - "FinchMobile.xcodeproj/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    name: Build FinchMobile (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Simulator, unsigned compile check)
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinchMobile.xcodeproj \
            -scheme FinchMobile \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Optional: device IPA when secrets are configured (paid Apple Developer)
      # Required secrets: APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_PROVISIONING_PROFILE_BASE64, KEYCHAIN_PASSWORD, TEAM_ID
      - name: Build device archive (optional)
        if: ${{ secrets.TEAM_ID != '' }}
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinchMobile.xcodeproj \
            -scheme FinchMobile \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/FinchMobile.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
