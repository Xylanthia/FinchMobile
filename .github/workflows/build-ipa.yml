name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash BUILD_UNSIGNED_IPA.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinchMobile-LATEST
          path: FinchMobile.ipa
          if-no-files-found: error
