name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash BUILD_UNSIGNED_IPA.sh
      - name: Name IPA for 3uTools
        run: |
          cp FinchMobile.ipa FinchMobile-3.2.ipa
          cp FinchMobile.ipa FinchMobile-3.1.ipa
          cp FinchMobile.ipa FinchMobile-3.0.ipa
          cp FinchMobile.ipa FinchMobile-2.7.ipa
          ls -lh FinchMobile*.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinchMobile-3.2
          path: |
            FinchMobile.ipa
            FinchMobile-3.2.ipa
            FinchMobile-3.1.ipa
            FinchMobile-3.0.ipa
            FinchMobile-2.7.ipa
          if-no-files-found: error
      - name: Publish download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-unsigned
          name: Finch Mobile — unsigned IPA (3uTools)
          body: |
            Unsigned IPA. On Windows: 3uTools → Toolbox → IPA Signature → sign with your Apple ID → install on iPhone.
            Then Settings → General → VPN & Device Management → trust the cert.
          files: |
            FinchMobile.ipa
            FinchMobile-3.2.ipa
            FinchMobile-3.1.ipa
            FinchMobile-3.0.ipa
            FinchMobile-2.7.ipa
          make_latest: true
          fail_on_unmatched_files: true
