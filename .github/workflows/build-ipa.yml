name: Build ARIA GPS candidate IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/finch-aria-gps-20261027]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA with the 3.2 process
        run: bash BUILD_UNSIGNED_IPA.sh
      - name: Name separate candidate
        run: cp FinchMobile.ipa FinchMobile-3.2-ARIA-GPS.ipa
      - name: Upload candidate IPA
        uses: actions/upload-artifact@v4
        with:
          name: FinchMobile-3.2-ARIA-GPS
          path: FinchMobile-3.2-ARIA-GPS.ipa
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-gps-build-log
          path: build.log
